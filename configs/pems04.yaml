seed: 42

data:
  npz: data/raw/PEMS04.npz
  edges: data/raw/PEMS04.csv
  key: data
  flow_channel: 0
  scaler: robust
  zero_as_missing: true
  start_weekday: 0
  split: [0.6, 0.2, 0.2]
  lookback: 12
  horizon: 12
  day_offset: 288
  week_offset: 2016
  steps_per_day: 288

graph:
  sigma: 1.0
  resolution: 0.5
  similarity_threshold: 0.5
  num_clusters: 48

model:
  hidden_dim: 64
  temporal_heads: 4
  temporal_layers: 3
  graph_heads: 4
  num_adaptive_blocks: 1
  dropout: 0.3

train:
  batch_size: 16
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  milestones: [20, 30]
  lr_gamma: 0.3
  huber_delta: 1.0
  patience: 10
  num_workers: 0
  output_dir: outputs/pems04
