<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 14; }
      .title { font: 700 22px sans-serif; fill: #111111; }
      .text { font: 16px sans-serif; fill: #222222; }
      .small { font: 14px sans-serif; fill: #444444; }
      .line { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">DynaFlux — Multi-Scale Dynamic Traffic Forecasting</text>

  <rect x="40" y="90" width="180" height="90" class="box"/>
  <text x="130" y="122" text-anchor="middle" class="text">Hour / Day / Week</text>
  <text x="130" y="150" text-anchor="middle" class="small">12-frame aligned windows</text>

  <rect x="280" y="90" width="190" height="90" class="box"/>
  <text x="375" y="122" text-anchor="middle" class="text">Temporal Encoder</text>
  <text x="375" y="150" text-anchor="middle" class="small">calendar + attention</text>

  <rect x="540" y="65" width="220" height="90" class="box"/>
  <text x="650" y="98" text-anchor="middle" class="text">Global Dynamic Graph</text>
  <text x="650" y="126" text-anchor="middle" class="small">similarity → Laplacian → K-means</text>

  <rect x="540" y="185" width="220" height="90" class="box"/>
  <text x="650" y="218" text-anchor="middle" class="text">Local Topology Graph</text>
  <text x="650" y="246" text-anchor="middle" class="small">Louvain + graph attention</text>

  <rect x="825" y="125" width="180" height="90" class="box"/>
  <text x="915" y="158" text-anchor="middle" class="text">Graph Fusion</text>
  <text x="915" y="186" text-anchor="middle" class="small">Softmax(A_G ⊙ A_L)</text>

  <rect x="825" y="300" width="180" height="90" class="box"/>
  <text x="915" y="333" text-anchor="middle" class="text">Gated Dilated Conv</text>
  <text x="915" y="361" text-anchor="middle" class="small">adaptive temporal fusion</text>

  <rect x="1040" y="300" width="130" height="90" class="box"/>
  <text x="1105" y="333" text-anchor="middle" class="text">Regression</text>
  <text x="1105" y="361" text-anchor="middle" class="small">12-step output</text>

  <path d="M220 135 L280 135" class="line"/>
  <path d="M470 120 L540 110" class="line"/>
  <path d="M470 150 L540 230" class="line"/>
  <path d="M760 110 L825 155" class="line"/>
  <path d="M760 230 L825 185" class="line"/>
  <path d="M915 215 L915 300" class="line"/>
  <path d="M1005 345 L1040 345" class="line"/>

  <rect x="280" y="430" width="725" height="75" class="box"/>
  <text x="642" y="460" text-anchor="middle" class="text">Three isomorphic branches share the same processing logic</text>
  <text x="642" y="486" text-anchor="middle" class="small">branch outputs are concatenated before multi-horizon regression</text>
</svg>
