[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaflux"
version = "0.1.0"
description = "Multi-scale dynamic graph learning for traffic-flow forecasting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "networkx>=3.2",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dynaflux*"]
